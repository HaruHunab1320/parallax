{{- if .Values.controlPlane.enabled }}
{{- $secret := required "controlPlane.existingSecret must reference provisioned database and authentication credentials" .Values.controlPlane.existingSecret }}
{{- $tlsSecret := required "controlPlane.grpcTls.existingSecret must reference a server TLS certificate and key" .Values.controlPlane.grpcTls.existingSecret }}
{{- if .Values.controlPlane.restLoadBalancer.enabled }}
{{- fail "Direct HTTP LoadBalancer is unsupported; disable controlPlane.restLoadBalancer and configure HTTPS ingress" }}
{{- end }}
{{- if and .Values.ingress.enabled (empty .Values.ingress.tls) }}
{{- fail "ingress.tls is required when exposing the authenticated HTTP API" }}
{{- end }}
{{- if .Values.controlPlane.licenseKey }}
{{- fail "Move licenseKey into PARALLAX_LICENSE_KEY in controlPlane.existingSecret" }}
{{- end }}
{{- range $key, $value := .Values.controlPlane.env }}
{{- if or (has $key (list "NODE_ENV" "JWT_SECRET" "DATABASE_URL" "PARALLAX_AUTH_MODE" "PARALLAX_GRPC_API_KEY" "PARALLAX_RUNTIME_API_KEY" "PARALLAX_BOOTSTRAP_TOKEN" "PARALLAX_LICENSE_KEY")) (hasPrefix "PARALLAX_GRPC_TLS_" $key) }}
{{- fail (printf "controlPlane.env.%s conflicts with managed security configuration; use Secret references or grpcTls values" $key) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "parallax.fullname" . }}-control-plane
  labels:
    {{- include "parallax.controlPlane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controlPlane.replicaCount }}
  selector:
    matchLabels:
      {{- include "parallax.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/control-plane-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "parallax.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "parallax.fullname" . }}-control-plane
      securityContext:
        {{- toYaml .Values.security.podSecurityContext | nindent 8 }}
      initContainers:
        {{- if .Values.controlPlane.cloudSqlProxy.enabled }}
        # Native sidecar: starts before other init containers, stays running for pod lifetime
        - name: cloud-sql-proxy
          image: "{{ .Values.controlPlane.cloudSqlProxy.image | default "gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0" }}"
          args:
            - "--structured-logs"
            - "--port=5432"
            - "--health-check"
            - "--http-address=0.0.0.0"
            - "--http-port=9090"
            - "{{ .Values.controlPlane.cloudSqlProxy.connectionName }}"
          restartPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            requests:
              memory: 64Mi
              cpu: 20m
            limits:
              memory: 512Mi
              cpu: 200m
          startupProbe:
            httpGet:
              path: /startup
              port: 9090
            periodSeconds: 1
            failureThreshold: 60
        {{- end }}
        - name: migrate
          image: "{{ .Values.controlPlane.image.repository }}:{{ .Values.controlPlane.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: DATABASE_URL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: control-plane
          securityContext:
            {{- toYaml .Values.security.containerSecurityContext | nindent 12 }}
          image: "{{ .Values.controlPlane.image.repository }}:{{ .Values.controlPlane.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.controlPlane.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.controlPlane.service.metricsPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.controlPlane.service.grpcPort | default 8081 }}
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.controlPlane.service.port }}"
            - name: METRICS_PORT
              value: "{{ .Values.controlPlane.service.metricsPort }}"
            - name: GRPC_PORT
              value: "{{ .Values.controlPlane.service.grpcPort | default 8081 }}"
            - name: NODE_ENV
              value: "production"
            - name: PARALLAX_ETCD_ENDPOINTS
              value: "{{ include "parallax.fullname" . }}-etcd:2379"
            {{- if .Values.influxdb.enabled }}
            - name: PARALLAX_CONFIDENCE_STORE
              value: "influxdb"
            - name: INFLUXDB_URL
              value: "http://{{ include "parallax.fullname" . }}-influxdb:8086"
            - name: INFLUXDB_TOKEN
              value: "{{ .Values.influxdb.auth.admin.token }}"
            - name: INFLUXDB_ORG
              value: "{{ .Values.influxdb.auth.org }}"
            - name: INFLUXDB_BUCKET
              value: "{{ .Values.influxdb.auth.bucket }}"
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: PARALLAX_HA_ENABLED
              value: "true"
            - name: PARALLAX_REDIS_URL
              value: "redis://{{ include "parallax.fullname" . }}-redis:6379"
            {{- end }}
            - name: PARALLAX_AUTH_MODE
              value: "required"
            - name: PARALLAX_GRPC_TLS_ENABLED
              value: "true"
            - name: PARALLAX_GRPC_TLS_CERT
              value: /run/secrets/grpc/tls.crt
            - name: PARALLAX_GRPC_TLS_KEY
              value: /run/secrets/grpc/tls.key
            - name: PARALLAX_GRPC_TLS_REQUIRE_CLIENT_CERT
              value: {{ .Values.controlPlane.grpcTls.requireClientCert | quote }}
            {{- if .Values.controlPlane.grpcTls.requireClientCert }}
            - name: PARALLAX_GRPC_TLS_CA
              value: /run/secrets/grpc/{{ .Values.controlPlane.grpcTls.caKey }}
            {{- end }}
            {{- range $key := list "JWT_SECRET" "DATABASE_URL" "PARALLAX_GRPC_API_KEY" "PARALLAX_RUNTIME_API_KEY" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $key }}
            {{- end }}
            {{- range $key := list "PARALLAX_BOOTSTRAP_TOKEN" "PARALLAX_LICENSE_KEY" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
            {{- range $key, $value := .Values.controlPlane.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          volumeMounts:
            - name: grpc-tls
              mountPath: /run/secrets/grpc
              readOnly: true
            - name: patterns
              mountPath: /patterns
              readOnly: true
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: grpc-tls
          secret:
            secretName: {{ $tlsSecret }}
            defaultMode: 0440
        - name: patterns
          configMap:
            name: {{ .Values.controlPlane.patterns.configMap }}
            optional: true
        - name: config
          configMap:
            name: {{ include "parallax.fullname" . }}-control-plane
        - name: tmp
          emptyDir: {}
      {{- with .Values.controlPlane.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
