# GCP deployment values. Provision referenced Secrets and certificates before rollout.

controlPlane:
  replicaCount: 1
  existingSecret: parallax-secrets
  grpcTls:
    existingSecret: parallax-grpc-tls
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: parallax-cluster-sql-proxy@parallax-466513.iam.gserviceaccount.com
  cloudSqlProxy:
    enabled: true
    connectionName: parallax-466513:us-central1:parallax-cluster-postgres
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 1024Mi

operator:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

etcd:
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

postgresql:
  enabled: false

redis:
  enabled: false

influxdb:
  enabled: false

webDashboard:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

ingress:
  enabled: true
  tls:
    - secretName: parallax-http-tls
      hosts: [parallax.local]
  hosts:
    - host: parallax.local
      paths:
        - path: /api
          pathType: Prefix
          service: control-plane
        - path: /
          pathType: Prefix
          service: web-dashboard
          port: 80

security:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1001

monitoring:
  prometheus:
    serviceMonitor:
      enabled: false