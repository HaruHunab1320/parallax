name: Deploy to GKE

on:
  workflow_run:
    workflows: ["Build & Push Images"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Full commit SHA of previously validated and published images"
        required: true
        type: string
      skip_terraform:
        description: "Skip Terraform (Helm only)"
        required: false
        type: boolean
        default: false

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  GCP_ZONE: us-central1-a
  GKE_CLUSTER: parallax-cluster
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  REGISTRY: us-central1-docker.pkg.dev/parallax-466513/parallax

jobs:
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    # Automatic deploys after a main build are opt-in: the hardened chart needs
    # secrets (see docs/DEPLOYMENT_HARDENING.md) that must exist in the cluster
    # first. Set the repository variable PARALLAX_AUTO_DEPLOY=true once they do.
    # Manual dispatch with a validated image SHA always works.
    if: ${{ (vars.PARALLAX_AUTO_DEPLOY == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') || github.event_name == 'workflow_dispatch' }}

    permissions:
      contents: read
      id-token: write
      issues: write

    steps:
      - name: Validate requested source revision
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_SHA: ${{ inputs.image_sha }}
        run: |
          if ! [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "image_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.image_sha }}
          fetch-depth: 2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_ZONE }}

      - name: Resolve image tag
        id: image
        run: |
          TAG=$(git rev-parse HEAD)
          if ! [[ "$TAG" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Expected a full commit SHA" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Validate provisioned security configuration
        run: |
          node scripts/validate-deployment.mjs
          kubectl get secret parallax-secrets -n parallax -o json | node scripts/validate-deployment-secret.mjs
          kubectl get secret parallax-grpc-tls -n parallax -o json | node scripts/validate-deployment-secret.mjs --tls
          kubectl get secret parallax-http-tls -n parallax -o json | node scripts/validate-deployment-secret.mjs --tls
          for image in parallax-control-plane parallax-web-dashboard parallax-runtime-k8s; do
            gcloud artifacts docker images describe "${{ env.REGISTRY }}/$image:${{ steps.image.outputs.tag }}" --format='value(image_summary.digest)' > /dev/null
          done

      # --- Terraform (conditional) ---

      - name: Check for terraform changes
        id: tf-changes
        run: |
          if git diff --name-only HEAD~1 HEAD -- 'terraform/**' | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Should run Terraform
        id: should-tf
        run: |
          SKIP="${{ github.event.inputs.skip_terraform }}"
          if [ "$SKIP" = "true" ]; then
            echo "run=false" >> $GITHUB_OUTPUT
          elif [ "${{ steps.tf-changes.outputs.changed }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Terraform
        if: steps.should-tf.outputs.run == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        if: steps.should-tf.outputs.run == 'true'
        working-directory: terraform/gcp
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}"

      - name: Terraform Plan
        if: steps.should-tf.outputs.run == 'true'
        working-directory: terraform/gcp
        run: |
          terraform plan \
            -var="project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="zone=${{ env.GCP_ZONE }}" \
            -var="parallax_image=${{ env.REGISTRY }}/parallax-control-plane:${{ steps.image.outputs.tag }}" \
            -var="grafana_admin_password=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            -var='authorized_networks=${{ secrets.TF_AUTHORIZED_NETWORKS }}' \
            -var='master_authorized_networks=${{ secrets.TF_MASTER_AUTHORIZED_NETWORKS }}' \
            -var-file="environments/gcp.tfvars" \
            -out=tfplan

      - name: Terraform Apply
        if: steps.should-tf.outputs.run == 'true'
        working-directory: terraform/gcp
        run: terraform apply -auto-approve tfplan

      # --- Helm deploy ---

      - name: Deploy with Helm
        run: |
          helm upgrade --install parallax ./k8s/helm/parallax \
            --namespace parallax \
            --create-namespace \
            --values "k8s/helm/parallax/values-gcp.yaml" \
            --set controlPlane.image.repository=${{ env.REGISTRY }}/parallax-control-plane \
            --set controlPlane.image.tag=${{ steps.image.outputs.tag }} \
            --set webDashboard.image.repository=${{ env.REGISTRY }}/parallax-web-dashboard \
            --set webDashboard.image.tag=${{ steps.image.outputs.tag }} \
            --atomic \
            --wait \
            --timeout 10m

      # --- runtime-k8s (standalone manifest) ---

      - name: Apply runtime manifest from the validated source revision
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          node -e 'const fs = require("node:fs"); const source = fs.readFileSync("k8s/runtime-k8s-deployment.yaml", "utf8"); process.stdout.write(source.replace("REGISTRY/parallax-runtime-k8s:latest", process.env.REGISTRY + "/parallax-runtime-k8s:" + process.env.IMAGE_TAG).replace("REGISTRY/", "us-central1-docker.pkg.dev/parallax-466513/"));' > /tmp/parallax-runtime-k8s.yaml
          kubectl apply -f /tmp/parallax-runtime-k8s.yaml

      # --- Verification ---

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/parallax-control-plane -n parallax --timeout=5m
          kubectl rollout status deployment/parallax-web-dashboard -n parallax --timeout=5m
          kubectl rollout status deployment/parallax-runtime-k8s -n parallax --timeout=5m

      - name: Health check
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=parallax,app.kubernetes.io/component=control-plane -n parallax --timeout=5m
          POD=$(kubectl get pod -l app.kubernetes.io/name=parallax,app.kubernetes.io/component=control-plane -n parallax -o jsonpath='{.items[0].metadata.name}')
          kubectl exec "$POD" -n parallax -- node -e "fetch('http://localhost:3000/health/live').then(r=>{if(!r.ok)process.exit(1);r.text().then(t=>console.log(t))})"

      - name: Post deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Values:** values-gcp.yaml" >> $GITHUB_STEP_SUMMARY
          echo "**Image tag:** \`${{ steps.image.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** ${{ env.GKE_CLUSTER }}" >> $GITHUB_STEP_SUMMARY
          echo "**Terraform:** ${{ steps.tf-changes.outputs.changed == 'true' && 'Applied' || 'Skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/parallax-control-plane:${{ steps.image.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/parallax-web-dashboard:${{ steps.image.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/parallax-runtime-k8s:${{ steps.image.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pod Status" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n parallax >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify on failure
    needs: deploy
    runs-on: ubuntu-latest
    if: failure()
    permissions:
      issues: write

    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_url = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const environment = '${{ github.event.inputs.environment || 'staging' }}';

            await github.rest.issues.create({
              owner,
              repo,
              title: `Deployment failed: ${environment} (${new Date().toISOString().slice(0, 10)})`,
              body: `## Deployment Failure\n\n**Environment:** ${environment}\n**Workflow:** ${context.workflow}\n**Run:** ${run_url}\n**SHA:** \`${context.sha}\`\n\nPlease investigate and fix the deployment issue.`,
              labels: ['deployment', 'bug']
            });
