name: CI

on:
  workflow_call:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build --filter='!./apps/demo-*' --filter='!./examples/*' --filter='!./demos/*'

      - name: Biome Check
        run: pnpm exec biome check --max-diagnostics=50

      - name: Lint
        run: pnpm turbo lint

      - name: Typecheck
        run: pnpm turbo type-check

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build --filter='!./apps/demo-*' --filter='!./examples/*' --filter='!./demos/*'

      - name: Test
        run: pnpm turbo test

  python-sdk:
    name: Python SDK transport security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: python -m pip install poetry==1.8.2
      - name: Install locked SDK and test dependencies
        run: poetry install --with dev --sync --no-interaction
      - name: Test unary, streaming, and agent registration authentication
        run: poetry run pytest -q

  database:
    name: Database security and persistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@parallaxai/control-plane
      - name: Migrate a fresh database and exercise persistence invariants
        run: pnpm test:db:isolated
      - uses: azure/setup-helm@v3
        with:
          version: v3.13.0
      - name: Validate deployment configuration
        run: node scripts/validate-deployment.mjs

  dependency-audit:
    name: Production dependency security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Audit production dependency graph
        run: pnpm audit --prod --audit-level=high --json > dependency-audit.json
      - name: Retain advisory inventory even when the gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-dependency-audit
          path: dependency-audit.json
          if-no-files-found: error
