name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Build, lint (Biome, ESLint, buf), typecheck and unit tests for every
    # package, exactly as `pnpm verify` runs them on a developer machine.
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: pnpm verify
        run: pnpm verify

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: python -m pip install poetry==1.8.2
      - name: Install locked SDK and test dependencies
        run: poetry install --with dev --sync --no-interaction
      - name: Lint Python SDK
        run: poetry run ruff check
      - name: Build Python SDK
        run: poetry build
      - name: Test unary, streaming, and agent registration authentication
        run: poetry run pytest -q

  database:
    name: Integration (Postgres, etcd) and deployment config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@parallaxai/control-plane
      - name: Migrate a fresh database and exercise persistence invariants
        run: pnpm test:db:isolated
      - uses: azure/setup-helm@v3
        with:
          version: v3.13.0
      - name: Validate deployment configuration
        run: node scripts/validate-deployment.mjs

  dependency-audit:
    name: Production dependency security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Audit production dependency graph
        # pnpm audit exits non-zero whenever it reports anything; the gate
        # below decides pass/fail against audit-allowlist.json.
        run: pnpm audit --prod --json > dependency-audit.json || true
      - name: Enforce the audit gate
        run: node scripts/audit/audit-gate.mjs --report dependency-audit.json
      - name: Retain advisory inventory even when the gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-dependency-audit
          path: dependency-audit.json
          if-no-files-found: error
